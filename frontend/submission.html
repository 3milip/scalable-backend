<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Judge — zgłoszenie</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Judge</h1>
      <nav>
        <a href="index.html">Start</a>
        <a href="/contest">OIOIOI</a>
        <a href="problems.html">Laboratorium</a>
        <a href="submissions.html">API zgłoszenia</a>
        <a href="stats.html">Kolejka API</a>
      </nav>
    </header>

    <main>
      <p><a href="submissions.html">← zgłoszenia</a></p>
      <p id="status">Łączenie z backendem…</p>
      <h2 id="title"></h2>
      <div class="cards">
        <div class="card">
          <span class="label">status</span>
          <span class="value" id="sub-status">–</span>
        </div>
        <div class="card">
          <span class="label">werdykt</span>
          <span class="value" id="verdict">–</span>
        </div>
        <div class="card">
          <span class="label">czas (ms)</span>
          <span class="value" id="time">–</span>
        </div>
        <div class="card">
          <span class="label">RAM (kB)</span>
          <span class="value" id="memory">–</span>
        </div>
        <div class="card">
          <span class="label">punkty</span>
          <span class="value" id="score">–</span>
        </div>
      </div>
      <p id="message"></p>
      <h3>Testy</h3>
      <p id="tests-empty" class="muted">Jeszcze brak wyników (kolejka albo compile).</p>
      <table id="tests-table" hidden>
        <thead>
          <tr>
            <th>#</th>
            <th>Grupa</th>
            <th>Werdykt</th>
            <th>Pkt</th>
            <th>Czas</th>
            <th>RAM</th>
            <th>Komentarz</th>
          </tr>
        </thead>
        <tbody id="tests-rows"></tbody>
      </table>
      <h3>Wysłany kod</h3>
      <pre id="code"></pre>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      function formatScore(score, maxScore) {
        const max = maxScore ?? 0;
        if (score === null || score === undefined) return "– / " + max;
        return score + " / " + max;
      }

      function addCell(tr, text) {
        const td = document.createElement("td");
        td.textContent = text;
        tr.appendChild(td);
        return td;
      }

      function renderTests(tests) {
        const empty = document.getElementById("tests-empty");
        const table = document.getElementById("tests-table");
        const body = document.getElementById("tests-rows");
        body.innerHTML = "";
        if (!tests.length) {
          empty.hidden = false;
          table.hidden = true;
          return;
        }
        empty.hidden = true;
        table.hidden = false;
        for (const test of tests) {
          const tr = document.createElement("tr");
          addCell(tr, String((test.position ?? 0) + 1) + (test.hidden ? " (ukryty)" : ""));
          addCell(tr, test.group ?? "–");
          addCell(tr, test.verdict ?? "–");
          addCell(tr, (test.score ?? 0) + " / " + (test.max_score ?? 0));
          addCell(tr, test.time_ms ?? "–");
          addCell(tr, test.memory_kb ?? "–");
          addCell(tr, test.message ?? "");
          body.appendChild(tr);
          if (!test.hidden && (test.input || test.output)) {
            const io = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = 7;
            td.className = "io-cell";
            const preIn = document.createElement("pre");
            preIn.textContent = "wejście:\n" + (test.input ?? "");
            const preOut = document.createElement("pre");
            preOut.textContent = "wyjście wzorcowe:\n" + (test.output ?? "");
            td.appendChild(preIn);
            td.appendChild(preOut);
            io.appendChild(td);
            body.appendChild(io);
          }
        }
      }

      if (!id) {
        document.getElementById("status").textContent =
          "Brak id w adresie. Wejdź z formularza albo dopisz ?id=1";
      } else {
        loadSubmission();
        setInterval(loadSubmission, 2000);
      }

      async function loadSubmission() {
        try {
          const response = await fetch("http://127.0.0.1:8000/submissions/" + id);
          if (response.status === 404) {
            document.getElementById("status").textContent = "Nie ma takiego zgłoszenia";
            return;
          }
          const sub = await response.json();

          document.getElementById("title").textContent = "Zgłoszenie #" + sub.id;
          document.getElementById("sub-status").textContent = sub.status;
          document.getElementById("verdict").textContent = sub.verdict ?? "–";
          document.getElementById("time").textContent = sub.time_ms ?? "–";
          document.getElementById("memory").textContent = sub.memory_kb ?? "–";
          document.getElementById("score").textContent = formatScore(sub.score, sub.max_score);
          document.getElementById("message").textContent = sub.message ?? "";
          document.getElementById("code").textContent = sub.code ?? "";
          document.getElementById("status").textContent =
            "Zadanie #" + sub.problem_id + " · " + sub.language;
          renderTests(sub.tests || []);
        } catch (error) {
          document.getElementById("status").textContent =
            "Nie mogę połączyć. Odpal backend: uvicorn app.main:app --reload";
        }
      }
    </script>
  </body>
</html>
