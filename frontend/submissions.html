<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Judge — zgłoszenia</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Judge</h1>
      <nav>
        <a href="index.html">Start</a>
        <a href="problems.html">Zadania</a>
        <a href="submissions.html">Zgłoszenia</a>
        <a href="stats.html">Obciążenie</a>
      </nav>
    </header>

    <main>
      <h2>Zgłoszenia</h2>
      <p id="status">Łączenie z backendem…</p>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Zadanie</th>
            <th>Status</th>
            <th>Werdykt</th>
            <th>Czas</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>

    <script>
      async function loadSubmissions() {
        try {
          const response = await fetch("http://127.0.0.1:8000/submissions?limit=50");
          const data = await response.json();
          const rows = document.getElementById("rows");
          rows.innerHTML = "";

          for (const item of data.items) {
            const tr = document.createElement("tr");
            tr.innerHTML =
              "<td><a href=\"submission.html?id=" +
              item.id +
              "\">" +
              item.id +
              "</a></td><td>" +
              item.problem_title +
              "</td><td>" +
              item.status +
              "</td><td>" +
              (item.verdict ?? "–") +
              "</td><td>" +
              (item.time_ms ?? "–") +
              "</td>";
            rows.appendChild(tr);
          }

          document.getElementById("status").textContent =
            data.total === 0
              ? "Nie ma jeszcze żadnego zgłoszenia"
              : "Wszystkich: " + data.total;
        } catch (error) {
          document.getElementById("status").textContent =
            "Nie mogę połączyć. Odpal backend: uvicorn app.main:app --reload";
        }
      }

      loadSubmissions();
      setInterval(loadSubmissions, 2000);
    </script>
  </body>
</html>
