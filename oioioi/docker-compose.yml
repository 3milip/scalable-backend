# Oficjalny stack OIOIOI (deployment).
# Źródło: https://github.com/sio2project/oioioi/blob/master/docker-compose.yml
# Obraz:  https://github.com/sio2project/oioioi/pkgs/container/oioioi
#
# Lokalne zmiany względem pliku z repo SIO2:
# - obraz z GHCR (compose SIO2 ma sio2project/oioioi:$OIOIOI_VERSION)
# - web na hoście :8001, żeby nie zderzyć się z backendem na :8000

x-common-envs: &common-envs
  FILETRACKER_URL: "http://web:9999"
  DATABASE_HOST: "db"
  DATABASE_PORT: "5432"
  OIOIOI_TIMEZONE: "${OIOIOI_TIMEZONE:-Europe/Warsaw}"

services:
  db:
    image: library/postgres:14.17
    environment:
      POSTGRES_USER: "oioioi"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "oioioi"
    volumes:
      - postgress-data:/var/lib/postgresql/data
    stop_grace_period: 1m

  web:
    image: ghcr.io/sio2project/oioioi:${OIOIOI_VERSION:-master}
    command: ["/sio2/oioioi/oioioi_init.sh"]
    environment:
      OIOIOI_DB_ENGINE: "django.db.backends.postgresql"
      OIOIOI_SERVER_MODE: "uwsgi-http"
      RABBITMQ_HOST: "broker"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "oioioi"
      RABBITMQ_PASSWORD: "oioioi"
      FILETRACKER_LISTEN_ADDR: "0.0.0.0"
      FILETRACKER_LISTEN_PORT: "9999"
      <<: *common-envs
    ports:
      - "8001:8000"
    stop_grace_period: 3m
    depends_on:
      - db
      - broker
    volumes:
      - filetracker-data:/sio2/deployment/media

  worker:
    image: ghcr.io/sio2project/oioioi:${OIOIOI_VERSION:-master}
    command: ["/sio2/oioioi/worker_init.sh"]
    environment:
      WEB_URL: "web:8000"
      <<: *common-envs
    stop_grace_period: 1m
    cap_add:
      - ALL
    depends_on:
      - db
      - broker

  broker:
    image: library/rabbitmq:3.8
    environment:
      RABBITMQ_DEFAULT_USER: oioioi
      RABBITMQ_DEFAULT_PASS: oioioi
    stop_grace_period: 1m

volumes:
  postgress-data:
  filetracker-data:
